name: offline-tests-and-packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate runtime configuration
        run: echo "ETSY_OAUTH_HOME=$RUNNER_TEMP/isolated-oauth-home" >> "$GITHUB_ENV"
      - name: Check source and public history
        run: python tools/check_release.py --history
      - name: Offline regression and release checks
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -t . -v
          python -m unittest discover -s release_checks -v
      - name: Build and inspect distributions
        run: |
          python -m pip install build
          python -m build
          python tools/check_release.py --artifacts dist/*.whl dist/*.tar.gz
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          python tools/smoke_install.py "$RUNNER_TEMP/wheel-venv/bin/python"
      - name: Rebuild and install from source distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/sdist-wheel" dist/*.tar.gz
          python tools/check_release.py --artifacts "$RUNNER_TEMP"/sdist-wheel/*.whl
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/sdist-wheel/*.whl
          python tools/smoke_install.py "$RUNNER_TEMP/sdist-venv/bin/python"
